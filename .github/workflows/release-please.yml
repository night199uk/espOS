#
# Releases, without anyone editing CHANGELOG.md or version numbers by hand.
#
# On a push to main that carries a change users get (the gate below),
# release-please keeps one pull request open, "chore: release <version>", that
# bumps version.txt and every espOS version in the component manifests and
# prepends the new CHANGELOG.md section. The version follows the Conventional
# Commit subjects merged since the last release (PR titles, since PRs are
# squash-merged); the section is the release notes GitHub generates for those
# pull requests, each with its author and a link to it, sorted by the labels
# label-by-title.yml sets (.github/release.yml). Merging that pull request IS
# the release: the next run tags it, creates the GitHub release with that
# section as its notes, and publishes the components to the registry below.
# Nothing is released until a maintainer merges the release PR.
#
# docs/releasing.md has the whole process; release-please-config.json lists
# the manifests it bumps.
name: release-please

on:
  push:
    branches: [main]
  # The gate runs release-please only for a push that carries a change users
  # get, so an open release PR is not refreshed by a docs or ci merge -- and a
  # change to the release configuration is exactly such a merge. A manual run
  # is what rewrites the open release PR against the current configuration.
  workflow_dispatch:

permissions: {}

jobs:
  # GitHub's release notes are never empty -- they always end in a "Full
  # Changelog" link -- so release-please, which skips a release only when its
  # notes are empty, would propose one after every merge, a docs or ci change
  # included. Only a push carrying a change users get goes on to it: a type
  # docs/releasing.md lists under Added, Fixed or Changed, a breaking change
  # whatever its type, a `Release-As:` footer because it names the release to
  # cut, and the merge of the release PR itself (pull-request-title-pattern in
  # release-please-config.json), which is what creates the tag. The subject is
  # each message's first line. The payload holds at most 2048 commits, so a
  # push that fills it may hide more and is let through.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      releasable: ${{ steps.check.outputs.releasable }}
    steps:
      # A manual run carries no commits of its own, so it judges every commit
      # since the last release instead: it goes on when there is a release PR
      # to refresh or a merged one still to tag, and stops when only docs or
      # ci changes are unreleased. With no tag for the manifest's version --
      # a merged release PR whose tag was never created -- it goes on.
      - uses: actions/checkout@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        env:
          DISPATCHED: ${{ github.event_name == 'workflow_dispatch' }}
          MESSAGES: ${{ toJSON(github.event.commits.*.message) }}
          RELEASABLE: '^((feat|fix|perf|refactor|revert)(\([^)]*\))?!?: |[a-z]+(\([^)]*\))?!: |Revert |chore: release v?[0-9])'
        run: |
          if [ "$DISPATCHED" = true ]; then
            last="v$(jq -er '."."' .release-please-manifest.json)"
            if ! git rev-parse -q --verify "refs/tags/$last" > /dev/null; then
              echo "releasable=true" >> "$GITHUB_OUTPUT"
              echo "No tag $last; release-please not gated."
              exit 0
            fi
            MESSAGES=$(git log -z --format=%B "$last..HEAD" | jq -Rs 'split("\u0000") | map(select(. != ""))')
            echo "Judging the $(jq length <<< "$MESSAGES") commits since $last."
          fi
          if jq -e --arg re "$RELEASABLE" '(length >= 2048) or ([.[] | (split("\n")[0] | test($re)) or test("\nBREAKING[- ]CHANGE: ") or test("\nRelease-As: ")] | any)' <<< "$MESSAGES" > /dev/null; then
            echo "releasable=true" >> "$GITHUB_OUTPUT"
          else
            echo "releasable=false" >> "$GITHUB_OUTPUT"
            echo "No releasable commit; release-please not run."
          fi

  release-please:
    needs: gate
    if: needs.gate.outputs.releasable == 'true'
    # One release-please at a time: two runs, a push and a manual run say,
    # could both find the merged release PR untagged and both try to create
    # its release. Never cancelled in progress, since a run may be creating
    # the tag. A queued run that a newer one replaces loses nothing, because
    # every run tags whatever merged release PR is still untagged and builds
    # the open one from the whole range. A run the gate stopped gets a group
    # of its own, so it can never displace a queued run that has work to do.
    concurrency:
      group: ${{ needs.gate.outputs.releasable == 'true' && 'release-please' || format('release-please-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
      pr_branch: ${{ steps.rp.outputs.pr && fromJSON(steps.rp.outputs.pr).headBranchName || '' }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The release PR bumps every espos_* manifest and leaves dependencies.lock
  # behind, because release-please edits files and nothing re-solves -- which
  # is how the 0.15.0 release put fourteen stale entries on main (#176, #178).
  # Regenerate it on the release branch, after release-please has written it.
  #
  # Pushed with DRIFT_PR_TOKEN when it is set: a push made with the workflow
  # token starts no workflow, so the release PR's checks would never run on
  # the corrected lock and the lock check would stay red on the commit before.
  #
  # It runs on EVERY push to main while a release PR is open, not only after
  # release-please: a merge the gate stops (a chore(deps) bump, say) can change
  # dependencies.lock on main, and release-please would not touch the release
  # branch for it -- nor even on a manual run, since the notes did not change.
  # The release branch's lock commit then conflicts with main and the release
  # PR cannot merge (0.18.0, after #213). So the job first brings main into
  # the release branch, takes main's side of a dependencies.lock conflict
  # (regenerated straight after), and stops on any other conflict, which needs
  # a person.
  release-lock:
    name: regenerate dependencies.lock on the release branch
    needs: [gate, release-please]
    if: always() && needs.gate.result == 'success' && needs.release-please.result != 'failure' && needs.release-please.result != 'cancelled'
    concurrency:
      group: release-lock
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Pushes the regenerated lock to the release branch.
    permissions:
      contents: write
      # gh pr list, to find the open release PR when release-please did not run.
      pull-requests: read
    steps:
      # release-please names the branch when it ran; otherwise look for an open
      # release PR's branch. None (no release pending, or the release PR just
      # merged and its branch is gone): nothing to do.
      - name: find the release branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_RP: ${{ needs.release-please.outputs.pr_branch }}
          DEFAULT: release-please--branches--main
        run: |
          set -euo pipefail
          name="$FROM_RP"
          if [ -z "$name" ]; then
            # An open PR from the branch implies the branch exists, so no
            # separate branch lookup. Any API failure (403, 429, 5xx) fails the
            # step through set -e rather than passing for "no release PR".
            open=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$DEFAULT" --state open --json number --jq length)
            if [ "$open" -gt 0 ]; then
              name="$DEFAULT"
            fi
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          [ -n "$name" ] || echo "No open release PR; nothing to regenerate."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.branch.outputs.name != ''
        with:
          ref: ${{ steps.branch.outputs.name }}
          fetch-depth: 0
          persist-credentials: false
      - name: bring main into the release branch
        if: steps.branch.outputs.name != ''
        run: |
          set -euo pipefail
          git config user.name 'espOS release'
          git config user.email 'noreply@github.com'
          git fetch --quiet origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "The release branch already contains main."
            exit 0
          fi
          if ! git merge --no-edit --no-ff origin/main; then
            conflicts=$(git diff --name-only --diff-filter=U)
            if [ "$conflicts" != "dependencies.lock" ]; then
              echo "::error::Merging main into the release branch conflicts outside dependencies.lock: $conflicts"
              exit 1
            fi
            # Main's side; the regeneration below rewrites it for the release.
            git checkout --theirs dependencies.lock
            git add dependencies.lock
            git commit --no-edit
          fi
      - name: read pinned IDF version
        if: steps.branch.outputs.name != ''
        id: idf
        run: echo "version=$(cat .idf-version)" >> "$GITHUB_OUTPUT"
      - uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        if: steps.branch.outputs.name != ''
        with:
          esp_idf_version: ${{ steps.idf.outputs.version }}
          target: esp32s3
          command: scripts/regen_lock.sh
      - name: commit the regenerated lock to the release branch
        if: steps.branch.outputs.name != ''
        env:
          GH_TOKEN: ${{ secrets.DRIFT_PR_TOKEN || github.token }}
          BORROWED: ${{ secrets.DRIFT_PR_TOKEN == '' }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          # The IDF container runs as root, so anything it wrote is root-owned
          # and git would refuse to add it.
          sudo chown -R "$(id -u):$(id -g)" .
          git config user.name 'espOS release'
          git config user.email 'noreply@github.com'
          if ! git diff --quiet -- dependencies.lock; then
            git add dependencies.lock
            git commit -m "chore: regenerate dependencies.lock for the release" \
              -m "The release bumps every espos_* manifest; scripts/regen_lock.sh on esp32s3 brings the lock along."
          fi
          # A merge of main above may need pushing even when the lock did not
          # change.
          if git merge-base --is-ancestor HEAD "origin/$BRANCH" 2>/dev/null; then
            echo "dependencies.lock already matches the release's manifests"
            exit 0
          fi
          # Supplied through askpass rather than a remote URL or an argument,
          # so the token never reaches .git/config or a process listing.
          askpass="$RUNNER_TEMP/askpass"
          # shellcheck disable=SC2016  # $GH_TOKEN is read when git runs this.
          printf '#!/bin/sh\nexec printf %%s "$GH_TOKEN"\n' > "$askpass"
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git push "https://x-access-token@github.com/$GITHUB_REPOSITORY.git" "HEAD:$BRANCH"
          # Still pushed: a correct lock that waits for a check beats a stale
          # one. But nothing re-runs CI on it, so say what is needed.
          if [ "$BORROWED" = "true" ]; then
            echo "::warning::DRIFT_PR_TOKEN is not set, so CI does not run on the regenerated lock. Close and reopen the release PR to run CI on its new head."
          fi

  # Called here rather than triggered by the tag: a tag release-please creates
  # with the workflow's own GITHUB_TOKEN starts no other workflow, so a
  # publish.yml waiting for `push: tags` would never run. Calling it directly
  # needs no personal access token.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # A called workflow cannot ask for more than the calling job was granted:
    # publish.yml's upload job needs id-token: write for the registry's OIDC
    # exchange, and without it here GitHub rejects the whole workflow file
    # ("nested job 'upload' is requesting 'id-token: write', but is only
    # allowed 'id-token: none'").
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      dry_run: false
    secrets: inherit

  # Build the example as a newcomer downloads it, from the release just
  # published: the one check that sees what the registry actually serves.
  registry-smoke:
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/registry-smoke.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
