name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# CI fans out to thirty jobs, and several fire at once around a release: the
# merge to main, and the pull request release-please reopens for the next
# version immediately after. Without a group they all queue against the
# repository's concurrent-job ceiling and the publish job, last in its chain,
# waits behind them.
#
# One run per ref, superseded ones cancelled: a new push to a branch makes the
# run already in flight for it pointless. main and tags are keyed per-commit
# (github.sha) instead, so a release's own run is never cancelled by the push
# that follows it -- those runs gate the release and must finish.
#
# Tags are keyed apart from main even though a release tags the commit it
# merged: the tag run is the only one that runs the version job (it is
# `if: startsWith(github.ref, 'refs/tags/v')`), so letting the two share a
# group would let the push cancel the run that carries that check.
concurrency:
  group: >-
    ci-${{ github.workflow }}-${{
      startsWith(github.ref, 'refs/tags/') && format('tag-{0}', github.sha)
      || github.ref == 'refs/heads/main' && format('main-{0}', github.sha)
      || github.ref
    }}
  cancel-in-progress: true

jobs:
  # A tag whose version.txt says something else makes every device built from
  # it report a version that matches no release. Cheap to check, impossible to
  # notice by eye once it has happened.
  version:
    name: tag matches version.txt
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: compare
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(cat version.txt)"
          echo "tag=$tag version.txt=$file"
          test "$tag" = "$file"
          for m in components/espos_*/idf_component.yml; do
            grep -qxF "version: \"$file\"" "$m" || { echo "$m does not carry version $file"; exit 1; }
          done

  # The generator lives inside espos_config so a registry-installed copy of the
  # component is self-contained; its tests moved with it.
  generator:
    name: descriptor generator (python)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s components/espos_config/tools -p 'test_*.py' -v

  # Other repositories call the reusable firmware workflows, so a syntax error
  # there breaks every one of their releases at once, reported against the
  # caller's line rather than ours (#123). The release tools the
  # workflows run are tested here too: their tests drive a local bare
  # repository through the failure modes the mirror has to survive.
  workflows:
    name: workflows and release tools
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: actionlint (config in .github/actionlint.yaml)
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The flash-size variant test runs end to end with what a release uses:
      # pinned littlefs-python and esptool, and gen_esp32part.py from the
      # pinned IDF.
      - name: release window and mirror tools
        run: |
          pip install --quiet "littlefs-python==0.19.0" "esptool==4.8.1"
          curl -fsSL -o "$RUNNER_TEMP/gen_esp32part.py" \
            "https://raw.githubusercontent.com/espressif/esp-idf/$(cat .idf-version)/components/partition_table/gen_esp32part.py"
          ESPOS_GEN_ESP32PART="$RUNNER_TEMP/gen_esp32part.py" \
            python3 -m unittest discover -s tools -p 'test_*.py' -v

  # Prose names CONFIG_ESPOS_* knobs the compiler never sees, so a renamed or
  # never-landed symbol leaves the docs pointing at nothing (signalk.md once
  # documented CONFIG_ESPOS_SK_MAX_NOTIFY). Compares docs against components/*/Kconfig.
  docs:
    name: docs reference real Kconfig symbols
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 tools/check_kconfig_docs.py
      - run: python3 tools/check_component_name_checks.py
      - run: scripts/check_doxyfile_inputs.sh
      # Tutorials that grow past a screenful stop being tutorials.
      - name: tutorial and guide size caps
        run: |
          for f in docs/tutorials/*.md; do n=$(wc -l < "$f"); [ "$n" -le 120 ] || { echo "$f: $n lines > 120"; exit 1; }; done
          n=$(wc -l < docs/migration-from-sensesp.md); [ "$n" -le 250 ] || { echo "migration guide: $n lines > 250"; exit 1; }

  # The public headers are the C ABI a binding is generated from. An IDF type
  # leaking into one, a CONFIG_ token deciding a struct's size, or a header a
  # C++ consumer cannot include all build fine as firmware and show up only
  # when someone runs bindgen -- so they are checked here (docs/development.md,
  # "Public API rules").
  headers:
    name: public headers follow the C ABI rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 tools/check_public_headers.py
      # A submodule build resolves siblings by name off EXTRA_COMPONENT_DIRS
      # whether the manifest declares them or not, so only this catches a
      # component that cannot be installed from the registry.
      - run: python3 tools/check_component_deps.py
      - run: python3 tools/check_published_files.py
      # The defaults file provides these to a prologue consumer; the lint
      # demands them from a registry consumer. A setting in one and not the
      # other is invisible to exactly the people who cannot see the defaults.
      - run: python3 tools/check_sdkconfig_lint.py

  format:
    name: clang-format (changed C/C++ files)
    # PRs only: the tree was never mass-formatted, so only the files a PR
    # touches are checked. The component .clang-format files (Google style for
    # espos_n2k/espos_voice/espos_audio) are found by clang-format itself.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install 'clang-format==23.*'
      - name: check changed files
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- \
                  | grep -E '\.(c|h|cpp|hpp)$' || true)
          if [ -z "$files" ]; then
            echo "no C/C++ files changed"
            exit 0
          fi
          printf '%s\n' "$files"
          printf '%s\n' "$files" | xargs clang-format --dry-run -Werror

  reuse:
    name: reuse lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6

  fuzz:
    name: fuzz the network parsers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # clang, for libFuzzer. gcc can build the harnesses but only replays a
      # corpus; the coverage-guided run is what finds anything new, and both
      # bugs this job exists because of were found that way.
      - run: sudo apt-get update && sudo apt-get install -y clang
      - name: fuzz
        env:
          FUZZ_SECONDS: 120
        run: ./test/fuzz/run.sh
      # A crash is written next to the corpus that produced it. Keeping it is
      # the difference between "the fuzz job went red" and a reproducer.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crashes
          path: test/fuzz/corpus/**/crash-*
          if-no-files-found: ignore

  secrets:
    name: no secrets tracked
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check_no_secrets.sh

  # Every component must pack for the Espressif Component Registry, or the
  # release job that uploads them fails after the tag exists; and every
  # manifest must carry version.txt's version (lockstep releases).
  manifests:
    name: registry manifests (pack dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: read pinned IDF version
        id: idf
        run: echo "version=$(cat .idf-version)" >> "$GITHUB_OUTPUT"
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ steps.idf.outputs.version }}
          target: esp32c6
          # The action wraps the command in single quotes itself; anything
          # non-trivial lives in a script so the quoting stays out of YAML.
          command: scripts/check_manifests.sh
      # A copy installed from the registry reads espOS's version from its own
      # manifest, which the component manager rewrites on packing. Check the
      # components' real pattern against the archives just packed.
      - name: registry copies can read espOS's version
        run: python3 scripts/check_packed_version.py
      # from_registry is a standalone project with its own IDF pin, which
      # build-firmware.yml reads for it; it must move with the tree's.
      - name: from_registry pins the same ESP-IDF as the tree
        run: cmp .idf-version components/espos_core/examples/from_registry/.idf-version
      # Checked on every PR, not only at release: a dependency cycle or a
      # component depending on one that no longer exists makes the publish
      # workflow fail AFTER the tag exists, and a registry version cannot be
      # taken back.
      - name: components can be published in dependency order
        run: ./scripts/registry_order.py --check
      # release-please bumps a manifest only when it is listed in
      # release-please-config.json and its espOS version lines are marked;
      # either half missing leaves a component at the old version.
      - name: release-please bumps every espOS version
        run: python3 scripts/check_release_markers.py

      # The responder lives in espos_wifi; a second declaration elsewhere is how
      # the dependency crept into espos_sk in the first place.
      - name: espressif/mdns is declared only where the responder lives
        run: |
          for m in components/espos_*/idf_component.yml; do
            case "$m" in components/espos_net/*|components/espos_n2k/*) continue;; esac
            ! grep -qE '^\s+espressif/mdns:' "$m" || { echo "$m: depend on espos_wifi instead"; exit 1; }
          done

  # The component manager rewrites only the lock entries a changed manifest
  # touches, so an entry nobody edits stays stale for ever and nothing else
  # notices (#176). Regenerated by the same script a maintainer and the drift
  # watcher use, and compared on the runner rather than in the IDF container,
  # where git refuses the root-owned checkout.
  lock:
    name: dependencies.lock matches the manifests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: read pinned IDF version
        id: idf
        run: echo "version=$(cat .idf-version)" >> "$GITHUB_OUTPUT"
      - uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: ${{ steps.idf.outputs.version }}
          target: esp32s3
          command: scripts/regen_lock.sh
      - name: compare with the committed lock
        run: |
          git diff --exit-code -- dependencies.lock || {
            echo "::error::dependencies.lock does not match the manifests -- run scripts/regen_lock.sh and commit the result"; exit 1; }

  ui:
    name: web ui (vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 24, matching what the bundle is built and committed with. The
          # committed ui-dist is diffed below, so a Node version that produced a
          # byte-different bundle would fail that check with nothing wrong.
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      # Before the build, because it is the faster of the two and a lint error is
      # not worth waiting through a bundle to hear about.
      - run: npm run lint
        working-directory: ui
      - run: npm run build
        working-directory: ui
      # The bundle is committed so firmware builds need no Node; a UI change
      # that forgets to rebuild it would ship the old page silently.
      - name: committed UI bundle is fresh
        run: |
          git add -N components/espos_httpd/ui-dist
          git diff --exit-code --stat components/espos_httpd/ui-dist || {
            echo "::error::components/espos_httpd/ui-dist is stale — run 'npm ci && npm run build' in ui/ and commit the bundle with the UI change"; exit 1; }

  firmware:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s3, esp32c3, esp32c6, esp32c5, esp32p4]
    steps:
      # Full history and tags: the version compiled into the image comes from
      # `git describe`, and a shallow clone has nothing to describe — the
      # artifacts would quietly fall back to version.txt and every build
      # between two releases would carry the same version again.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: read pinned IDF version
        id: idf
        run: echo "version=$(cat .idf-version)" >> "$GITHUB_OUTPUT"
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ steps.idf.outputs.version }}
          target: ${{ matrix.target }}
          # --format json2: ESP-IDF 6 removed `json` (tools/cmake/run_size_tool.cmake).
          command: >-
            bash -c "
            idf.py -DSDKCONFIG=build/sdkconfig build &&
            idf.py -DSDKCONFIG=build/sdkconfig size --format json2
            --output-file build/size-${{ matrix.target }}.json"
      # Absolute table plus the ota_0 budget on every run, no cross-run artifact
      # download: a build that stops fitting the slot is the failure that
      # matters, and it is caught on the PR. For a base/head diff, run
      # tools/espos_size_diff.py --base <size json from a main build> --head ...
      - name: size report
        run: |
          set -o pipefail
          python3 tools/espos_size_diff.py \
            --head build/size-${{ matrix.target }}.json --label ${{ matrix.target }} \
            --bin build/espos.bin --partitions components/espos_core/partitions/4mb.csv --max-percent 90 \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: espos-${{ matrix.target }}
          path: |
            build/espos.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/storage.bin
            build/size-${{ matrix.target }}.json
          if-no-files-found: error

  # Every example is a complete project on the framework; CI is what keeps
  # them building as espOS moves. minimal builds on every target because it
  # is also the template a newcomer clones.
  examples:
    name: example ${{ matrix.example }} on ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [esp32c6]
        example:
          - components/espos_core/examples/minimal
          - components/espos_core/examples/two_phase_boot
          - components/espos_config/examples/custom_settings
          - components/espos_httpd/examples/app_endpoint_and_page
          - components/espos_health/examples/health_and_led
          - components/espos_sk/examples/analog_input
          - components/espos_sk/examples/pulse_counter
          - components/espos_sk/examples/digital_switch
          - components/espos_sk/examples/listener_relay
          - components/espos_sk/examples/json_and_meta
          - components/espos_sk/examples/tls_server
        include:
          # The one example without the prologue: espOS named as a registry
          # dependency, plain IDF root CMakeLists, its own sdkconfig and
          # partition table. It is what a project outside this repository
          # looks like, so if it stops building, the documented path is
          # broken even though every other example still passes.
          - { example: components/espos_core/examples/from_registry, target: esp32c6 }
          # ...and on esp32, which needs its own sdkconfig.defaults.esp32 for the
          # Secure Boot V2 RSA scheme. That is the case a second target proves.
          - { example: components/espos_core/examples/from_registry, target: esp32 }
          - { example: components/espos_core/examples/minimal, target: esp32 }
          - { example: components/espos_core/examples/minimal, target: esp32s3 }
          - { example: components/espos_core/examples/minimal, target: esp32c3 }
          - { example: components/espos_core/examples/minimal, target: esp32p4 }
          - { example: components/espos_sk/examples/pulse_counter, target: esp32c3 }
          - { example: components/espos_core/examples/two_phase_boot, target: esp32p4 }
          - { example: components/espos_health/examples/health_and_led, target: esp32p4 }
          - { example: components/espos_sk/examples/analog_input, target: esp32p4 }
          - { example: components/espos_sk/examples/pulse_counter, target: esp32p4 }
          - { example: components/espos_sk/examples/digital_switch, target: esp32p4 }
          - { example: components/espos_sk/examples/listener_relay, target: esp32p4 }
          - { example: components/espos_sk/examples/json_and_meta, target: esp32p4 }
          - { example: components/espos_sk/examples/tls_server, target: esp32p4 }
          - { example: components/espos_flow/examples/sensor_graph, target: esp32c6 }
          - { example: components/espos_flow/examples/sensor_graph, target: esp32p4 }
          - { example: components/espos_sk_flow/examples/smart_switch, target: esp32c6 }
          - { example: components/espos_sk_flow/examples/smart_switch, target: esp32p4 }
          - { example: components/espos_sk_flow/examples/dusk_relay, target: esp32c6 }
          - { example: components/espos_ble/examples/ble_gateway, target: esp32p4 }
          - { example: components/espos_n2k/examples/n2k_candump, target: esp32p4 }
          - { example: components/espos_n2k/examples/n2k_switch_bank, target: esp32p4 }
          - { example: components/espos_n2k/examples/n2k_switch_bank, target: esp32s3 }
          - { example: components/espos_eth/examples/ethernet, target: esp32p4 }
          - { example: components/espos_power/examples/duty_cycle, target: esp32c6 }
          - { example: components/espos_power/examples/duty_cycle, target: esp32p4 }
          - { example: components/espos_prov/examples/ble_provisioning, target: esp32c6 }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: read pinned IDF version
        id: idf
        run: echo "version=$(cat .idf-version)" >> "$GITHUB_OUTPUT"
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ steps.idf.outputs.version }}
          target: ${{ matrix.target }}
          command: scripts/build_example.sh ${{ matrix.example }} ${{ matrix.target }}

  # Nothing in the core may link Wi-Fi: the H-series has none, and Ethernet or
  # Thread transports must be able to stand in. The minimal example on esp32h2
  # with espos_wifi excluded is the proof.
  headless:
    name: headless build esp32h2 (no espos_wifi)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: read pinned IDF version
        id: idf
        run: echo "version=$(cat .idf-version)" >> "$GITHUB_OUTPUT"
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ steps.idf.outputs.version }}
          target: esp32h2
          command: scripts/build_example.sh components/espos_core/examples/minimal esp32h2

  # espos_ble with the WiFi station off (CONFIG_ESPOS_WIFI=n) is a PoE-powered
  # BLE gateway, and espos_core compiles different code for it that no example
  # builds -- it failed to compile once, on a guard that tested for the WiFi
  # component rather than for the station starting. sdkconfig.local is the
  # prologue's own overlay slot, so espOS's and the example's defaults still
  # apply underneath it.
  ble-without-wifi:
    name: ble_gateway on esp32p4 with WiFi off
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: read pinned IDF version
        id: idf
        run: echo "version=$(cat .idf-version)" >> "$GITHUB_OUTPUT"
      - name: turn the WiFi station off
        run: echo "CONFIG_ESPOS_WIFI=n" > components/espos_ble/examples/ble_gateway/sdkconfig.local
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ steps.idf.outputs.version }}
          target: esp32p4
          command: scripts/build_example.sh components/espos_ble/examples/ble_gateway esp32p4

  # A board variant has to add to espOS's defaults, not replace them: passed
  # as SDKCONFIG_DEFAULTS it once dropped the signed-update settings, and the
  # image would have installed over USB and refused every OTA after.
  # build-firmware.yml hands variants to the prologue this way.
  variant-defaults:
    name: board variant keeps espOS's defaults
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: read pinned IDF version
        id: idf
        run: echo "version=$(cat .idf-version)" >> "$GITHUB_OUTPUT"
      - name: write a variant
        run: echo "CONFIG_LOG_DEFAULT_LEVEL_WARN=y" > sdkconfig.board.test
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ steps.idf.outputs.version }}
          target: esp32c6
          command: >-
            idf.py -DSDKCONFIG=build/sdkconfig
            -DESPOS_EXTRA_SDKCONFIG_DEFAULTS=sdkconfig.board.test reconfigure
      - name: the variant and espOS's signed updates both landed
        run: |
          for want in CONFIG_LOG_DEFAULT_LEVEL_WARN=y CONFIG_SECURE_SIGNED_ON_UPDATE_NO_SECURE_BOOT=y; do
            grep -qxF "$want" build/sdkconfig || { echo "::error::$want missing from build/sdkconfig"; exit 1; }
          done

  host-tests:
    name: host tests (linux target)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: read pinned IDF version
        id: idf
        run: echo "version=$(cat .idf-version)" >> "$GITHUB_OUTPUT"
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ steps.idf.outputs.version }}
          target: linux
          # run_all.sh discovers every test/host/<project>/ — a new host test
          # runs here without touching this workflow, which is what the
          # hand-maintained chain this replaced kept getting wrong.
          command: >-
            bash -c "
            (apt-get update && apt-get install -y libbsd-dev) &&
            ./test/host/run_all.sh"
