#
# Build, merge and release a firmware built on espOS. Reusable: a consumer
# calls it and keeps a workflow of about fifteen lines instead of two hundred.
#
#   jobs:
#     firmware:
#       uses: signalk-espOS/espOS/.github/workflows/build-firmware.yml@main
#       with:
#         target: esp32p4
#         name: p4-cockpit
#         require: storage
#       secrets:
#         signing_key: ${{ secrets.SIGNING_KEY_PEM }}
#         dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
#         dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
#
# Driven by release-please, and/or several targets at once. Pass `tag`: a
# release created with the workflow token does not fire the `release:` event,
# so the caller is the only thing that knows it is building a release. Pass a
# distinct `artifact` per leg, because two legs uploading one name is an error.
# The caller then downloads them all and makes ONE release -- five parallel
# releases on one tag would race, and only an aggregate can attach every
# target's assets.
#
#   jobs:
#     firmware:
#       strategy:
#         matrix:
#           target: [esp32c5, esp32c6, esp32c3, esp32s3, esp32]
#       uses: signalk-espOS/espOS/.github/workflows/build-firmware.yml@main
#       with:
#         target: ${{ matrix.target }}
#         name: ble-gateway-${{ matrix.target }}
#         tag: ${{ inputs.tag }}
#         artifact: firmware-${{ matrix.target }}
#       secrets:
#         signing_key: ${{ secrets.SIGNING_KEY_PEM }}
#
# The reason this exists is not line count. Both espOS consumers had grown
# their own copy of the same release job, and the copies had already drifted:
# one checked the merged image for a blank storage partition, the other did
# not, and the check exists because a firmware merged without it BOOTS and
# serves a placeholder page that reads as a firmware bug.
#
# The signing key is the part worth getting right. A device only accepts an
# OTA signed with the key whose public half it was flashed with, so a release
# signed by a per-run throwaway installs fine over USB and then rejects every
# future update -- on the boat, months later, with no way back except a cable.
# This refuses to build a release without a key unless a repository variable
# says otherwise, and labels the result when it does.
name: build-firmware

on:
  workflow_call:
    inputs:
      target:
        description: "IDF target, e.g. esp32p4"
        type: string
        required: true
      name:
        description: "Asset name prefix, e.g. p4-cockpit"
        type: string
        required: true
      require:
        description: >-
          Space-separated partitions the merged image must contain. Use it for
          a data partition whose absence still leaves a bootable image.
        type: string
        default: ""
      submodules:
        description: "Checkout submodules (espOS is usually one)"
        type: string
        default: "recursive"
      esptool:
        description: "esptool version for the merge"
        type: string
        default: "4.8.1"
      tag:
        description: >-
          The release tag being built. Required from a workflow_call, because
          `github.event.release.tag_name` is empty there -- release-please
          creates the release with a token that does not fire the `release:`
          event, so the caller is the only thing that knows the tag.
        type: string
        default: ""
      artifact:
        description: >-
          Artifact name. Defaults to `firmware`, which is fine for one call and
          wrong for a matrix: two legs uploading one name is an error on
          upload-artifact v4+, so a multi-target caller passes a per-target
          name built from its own matrix value.

          Do not write that example as a literal expression here. GitHub
          evaluates ${} interpolations inside a `description:` value, and
          `matrix` does not exist in this workflow's context -- the whole file
          then fails to parse FOR EVERY CALLER, with the error reported against
          the caller's line number rather than this one.
        type: string
        default: "firmware"
      ref:
        description: >-
          Commit to build, usually the release tag. Empty builds the ref the
          caller runs on -- right for a release driven by release-please,
          wrong for a re-run or backfill of an older tag, which would build
          today's code and label it with the old version.
        type: string
        default: ""
      sdkconfig_defaults:
        description: >-
          Extra sdkconfig defaults files, `;`-separated and relative to the
          project, applied after sdkconfig.defaults -- how one project builds
          one image per board variant. A project on espOS's prologue gets
          them as ESPOS_EXTRA_SDKCONFIG_DEFAULTS, after espOS's defaults and
          its own; one without the prologue gets them in SDKCONFIG_DEFAULTS.
        type: string
        default: ""
    secrets:
      signing_key:
        description: >-
          PEM of the app-signing key. Required for a release; without it
          devices in the field can never take another OTA from you.
        required: false
      dockerhub_username:
        description: >-
          Docker Hub user to pull the ESP-IDF image as. A secret rather than an
          input so a caller can pass either a variable or a secret; with the
          token, it lifts the anonymous pull limit shared by every job on the
          runner's address. Optional: without both the image is pulled
          anonymously, as before.
        required: false
      dockerhub_token:
        description: "Docker Hub access token for dockerhub_username"
        required: false
    outputs:
      unsigned:
        description: "true when the release was built with a throwaway key"
        value: ${{ jobs.build.outputs.unsigned }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A step's `if:` cannot read secrets, so whether to log in is decided here.
    env:
      DOCKERHUB_LOGIN: ${{ secrets.dockerhub_username != '' && secrets.dockerhub_token != '' }}
    outputs:
      unsigned: ${{ steps.signing.outputs.unsigned }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          submodules: ${{ inputs.submodules }}
          # The version baked into the image comes from `git describe`, and
          # checkout's default depth of 1 fetches no tags -- not in this
          # repository and not in the espOS submodule. Describe then answers
          # with a bare commit hash, espos_version.cmake rejects that as
          # not-a-version and falls back to version.txt, so EVERY build
          # between two releases ships claiming to be that release: `1.1.0`
          # rather than `1.1.0-11-g8533ab4`, which is exactly the distinction
          # the version machinery exists to make. The same shallowness leaves
          # the submodule with zero tags, so the log cannot name which espOS
          # went into the image either. Every consumer of this workflow gets
          # this right by inheriting it.
          fetch-depth: 0
          # The build needs no credentials, and a workflow that keeps them is
          # a workflow whose every step could push.
          persist-credentials: false

      # espOS's own tools, from the commit this workflow runs at. A project
      # that has espOS as a submodule carries them under espos/, but one that
      # installs espOS from the component registry has no copy at all -- the
      # merge tool is not part of any component.
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .espos-workflow
          sparse-checkout: tools
          persist-credentials: false

      # The pin lives in the repository, not here, so a consumer that has not
      # moved to a new IDF is not moved by an espOS change.
      - name: read pinned IDF version
        id: idf
        run: |
          v="$(cat .idf-version 2>/dev/null || cat espos/.idf-version 2>/dev/null || true)"
          if [ -z "$v" ]; then
            echo "::error::No .idf-version. Add one at the project root naming the" \
                 "ESP-IDF release you build with, e.g. v6.0.3 (the from_registry" \
                 "example ships one)."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "building with ESP-IDF $v"

      # This condition must track the artifact upload below: every event that
      # publishes an image is an event whose image somebody flashes.
      #
      # inputs.tag counts as a release: without it a workflow_call skipped the
      # whole step, no key was restored, and the release went out signed with a
      # throwaway -- installable over USB and then refusing every future OTA, on
      # the boat, months later.
      #
      # workflow_dispatch counts too, and that is not hypothetical. This file is
      # workflow_call only, so `github.event_name` is the CALLER's event: a
      # consumer whose dispatch-triggered workflow calls this one without a tag
      # uploaded an artifact signed with a key that existed only inside that run.
      # espos-p4-cockpit did exactly that to build the images its bump PRs call
      # "the ones to test-flash", and a panel flashed with one refused every
      # later OTA (ESP_ERR_OTA_VALIDATE_FAILED) until somebody brought a cable.
      #
      # `pull_request` is deliberately NOT here, and must not be added: a
      # same-repository PR does receive secrets and can alter the workflow that
      # reads them, so that would hand the signing key to anything anyone opens a
      # PR with. The key cannot be rotated cheaply -- every device already
      # flashed with it stops accepting OTAs the day it changes. The upload
      # condition has no PR leg either; keep them that way together.
      - name: restore the signing key
        id: signing
        if: >-
          github.event_name == 'release' ||
          github.event_name == 'workflow_dispatch' ||
          inputs.tag != ''
        env:
          KEY: ${{ secrets.signing_key }}
          ALLOW_UNSIGNED: ${{ vars.ESPOS_ALLOW_UNSIGNED_RELEASE }}
          # A release must not go out unsigned by accident; a dispatch may, since
          # a fork dispatching a build has no access to the secret at all.
          IS_RELEASE: ${{ github.event_name == 'release' || inputs.tag != '' }}
        run: |
          if [ -z "$KEY" ] && [ "$IS_RELEASE" != "true" ]; then
            # Warn rather than fail: a fork dispatching this wants a binary, and
            # hard-failing would take that away. Loud, because the artifact is
            # the thing somebody is about to put on a panel.
            echo "::warning::No signing key for this dispatched build: it will" \
                 "be signed with a throwaway. It boots over USB, and a panel" \
                 "flashed with it will reject EVERY later OTA. Do not" \
                 "test-flash it to a device you intend to update over the air."
            echo "unsigned=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$KEY" ] && [ "$ALLOW_UNSIGNED" = "true" ]; then
            # The opt-out, for a fork that wants a flashable binary and runs
            # no OTA fleet. CMake generates a throwaway key, so this release
            # installs over USB and no device will ever accept an OTA signed
            # by a later build. Deliberate, and labelled in the release notes
            # rather than left for someone to discover on a boat.
            echo "::warning::ESPOS_ALLOW_UNSIGNED_RELEASE is set: building with" \
                 "a throwaway signing key. USB flashing works; OTA does NOT."
            echo "unsigned=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$KEY" ]; then
            echo "::error::No signing key. Releases are signed so devices can" \
                 "verify OTA updates; without a stable key an installed device" \
                 "could never be updated over the air again."
            echo "::error::  espsecure generate-signing-key --version 2 --scheme rsa3072 signing_key.pem"
            echo "::error::  gh secret set SIGNING_KEY_PEM < signing_key.pem"
            echo "::error::Keep that file safe: losing it means no existing" \
                 "device can take another OTA."
            echo "::error::To release without OTA support (USB only), set the" \
                 "repository variable ESPOS_ALLOW_UNSIGNED_RELEASE=true."
            exit 1
          fi
          printf '%s' "$KEY" > secure_boot_signing_key.pem
          # A truncated or mangled secret would otherwise surface as a cryptic
          # CMake failure after the build has already run for six minutes.
          openssl rsa -in secure_boot_signing_key.pem -noout -check

      # A throwaway key for a build that is not a signed release: CI on a
      # push or PR, and the unsigned opt-out above. espOS's prologue makes one
      # itself, but a project on the component registry has no prologue, and
      # IDF then stops the build on the missing key. openssl rather than
      # espsecure: it is on the runner and its spelling does not change
      # between esptool versions.
      - name: throwaway signing key for an unsigned build
        # Asked of the signing step rather than re-derived from the event: those
        # two spellings drifting apart is what this PR's review was about. Either
        # the step ran and reported it had no key, or it did not run at all.
        if: >-
          steps.signing.outputs.unsigned == 'true' ||
          steps.signing.outcome != 'success'
        run: |
          [ -f secure_boot_signing_key.pem ] ||
            openssl genrsa -out secure_boot_signing_key.pem 3072

      # Board variants, checked here because the value is pasted into the
      # build command below.
      - name: build command
        id: cmd
        env:
          DEFAULTS: ${{ inputs.sdkconfig_defaults }}
        run: |
          if [ -z "$DEFAULTS" ]; then
            echo "command=idf.py build" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$DEFAULTS" =~ ^[A-Za-z0-9._/-]+(\;[A-Za-z0-9._/-]+)*$ ]]; then
            echo "::error::refusing sdkconfig_defaults '$DEFAULTS'"
            exit 1
          fi
          IFS=';' read -ra files <<< "$DEFAULTS"
          for f in "${files[@]}"; do
            # Inside the project only: no absolute path, no way out of it.
            case "/$f/" in
              //*|*/../*) echo "::error::sdkconfig_defaults: '$f' must be a path inside the project"; exit 1 ;;
            esac
            [ -f "$f" ] || { echo "::error::sdkconfig_defaults: no file '$f'"; exit 1; }
          done
          # A project on espOS's prologue gets the files ADDED to espOS's
          # defaults. Passed as SDKCONFIG_DEFAULTS they would replace them,
          # signed-update settings included: an image that installs over USB
          # and is refused by every OTA after. Which of the two to use is a
          # guess from the source, so a step after the build checks it.
          if grep -qs 'espos_project_prologue' CMakeLists.txt; then
            echo "command=idf.py -D ESPOS_EXTRA_SDKCONFIG_DEFAULTS=\"$DEFAULTS\" build" \
              >> "$GITHUB_OUTPUT"
          else
            echo "command=idf.py -D SDKCONFIG_DEFAULTS=\"sdkconfig.defaults;$DEFAULTS\" build" \
              >> "$GITHUB_OUTPUT"
          fi

      # Anonymous pulls of the ESP-IDF image are rate limited per runner
      # address, so a release could fail on a pull another repository's job
      # spent. A failed login falls back to that anonymous pull rather than
      # failing the release.
      - name: log in to Docker Hub
        if: env.DOCKERHUB_LOGIN == 'true'
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ steps.idf.outputs.version }}
          target: ${{ inputs.target }}
          command: ${{ steps.cmd.outputs.command }}

      # Two ways a variant build goes wrong without failing: an espOS older
      # than ESPOS_EXTRA_SDKCONFIG_DEFAULTS ignores it and every variant comes
      # out the same, and a project whose prologue call the step above missed
      # got SDKCONFIG_DEFAULTS, which drops espOS's own defaults.
      - name: check the board variant took effect
        if: inputs.sdkconfig_defaults != ''
        env:
          DEFAULTS: ${{ inputs.sdkconfig_defaults }}
          COMMAND: ${{ steps.cmd.outputs.command }}
        run: |
          if [ -f build/espos_partitions.defaults ] && [[ "$COMMAND" == *" SDKCONFIG_DEFAULTS="* ]]; then
            echo "::error::this project runs espOS's prologue, but the build passed SDKCONFIG_DEFAULTS, which replaces espOS's defaults (signed updates included); call espos_project_prologue() from the root CMakeLists.txt"
            exit 1
          fi
          IFS=';' read -ra files <<< "$DEFAULTS"
          for f in "${files[@]}"; do
            # Only the partition fragment comes after a variant here, so each
            # line of it must be in the result as written.
            while IFS= read -r line; do
              line=${line%$'\r'}
              # Kconfig writes an option turned off as a comment.
              [[ "$line" =~ ^(CONFIG_[A-Za-z0-9_]+)=n$ ]] &&
                line="# ${BASH_REMATCH[1]} is not set"
              grep -qxF -- "$line" sdkconfig || {
                echo "::error::$f sets '$line', which is not in the built sdkconfig. An espOS older than ESPOS_EXTRA_SDKCONFIG_DEFAULTS ignores the variant (bump the submodule), or the option depends on one that is off."
                exit 1
              }
            done < <(grep -E '^CONFIG_[A-Za-z0-9_]+=' "$f")
          done

      - name: merge the flash images
        env:
          REQUIRE: ${{ inputs.require }}
        run: |
          pip install --quiet "esptool==${{ inputs.esptool }}"
          merge="tools/espos_merge_firmware.py"
          [ -f "$merge" ] || merge="espos/tools/espos_merge_firmware.py"
          [ -f "$merge" ] || merge=".espos-workflow/tools/espos_merge_firmware.py"
          args=""
          for r in $REQUIRE; do args="$args --require $r"; done
          # shellcheck disable=SC2086
          python "$merge" --build-dir build --chip "${{ inputs.target }}" \
            --out merged.bin $args

      # Also on a workflow_call: a caller driven by release-please IS a release,
      # and gating on the `release` event alone meant the reusable workflow
      # built a release and then uploaded nothing -- which is why both consumers
      # kept their own copy of this job instead.
      - name: stage the assets
        if: >-
          github.event_name == 'release' ||
          github.event_name == 'workflow_dispatch' ||
          inputs.tag != ''
        env:
          # Via env, not an expression: a tag name is arbitrary text and would
          # otherwise be pasted into this script before bash parses it.
          # inputs.tag first: on a workflow_call the release event is absent.
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          NAME: ${{ inputs.name }}
        run: |
          # A manual run is not a release: tag it with the commit so two
          # dispatch builds are never indistinguishable on disk.
          VERSION="${TAG:-$(cat version.txt 2>/dev/null || echo 0.0.0)-g$(git rev-parse --short HEAD)}"
          case "$VERSION" in
            *[!A-Za-z0-9._-]*) echo "::error::refusing unsafe tag '$VERSION'"; exit 1 ;;
          esac
          mkdir -p dist
          cp merged.bin "dist/${NAME}-${VERSION}-merged.bin"
          # The app image on its own is what a device fetches for an OTA; the
          # merged one is for a cable. Both, because they are not the same
          # file and picking the wrong one fails confusingly.
          app="$(python - <<'PY'
          import json, pathlib
          fa = json.loads(pathlib.Path("build/flasher_args.json").read_text())
          print(fa["app"]["file"])
          PY
          )"
          cp "build/$app" "dist/${NAME}-${VERSION}-ota.bin"
          ls -l dist/

      - name: upload
        if: >-
          github.event_name == 'release' ||
          github.event_name == 'workflow_dispatch' ||
          inputs.tag != ''
        uses: actions/upload-artifact@v7
        with:
          # One flat directory: upload-artifact strips to the least common
          # ancestor, so mixing build/foo.bin with a top-level file silently
          # drops the prefix a later job asked for.
          #
          # Named by the caller so a per-target matrix does not collide: two
          # legs uploading one name is an error on upload-artifact v4+.
          name: ${{ inputs.artifact }}
          path: dist/
          if-no-files-found: error
