## espos_devices component manifest: registry metadata for signalk-espos/espos_devices.
# x-release-please-start-version
version: "0.21.0"
# x-release-please-end
description: "Whole marine devices as graph nodes: tank senders, engine RPM, switches"
url: "https://github.com/signalk-espOS/espOS/tree/main/components/espos_devices"
repository: "https://github.com/signalk-espOS/espOS.git"
documentation: "https://github.com/signalk-espOS/espOS/blob/main/docs/devices.md"
issues: "https://github.com/signalk-espOS/espOS/issues"
license: "Apache-2.0"
maintainers:
  - "Dirk Wahrheit <dirkwahrheit@gmail.com>"
tags:
  - signalk
  - marine
  - esp-idf
  - espos
  - sensors
files:
  exclude:
    - "build/**/*"
    - "build-*/**/*"
    - "sdkconfig*"
    - "managed_components/**/*"
    - "dependencies.lock"
    - "examples/*/build/**/*"
    - "examples/*/build-*/**/*"
    - "examples/*/managed_components/**/*"
    - "examples/*/dependencies.lock"
    # The GENERATED sdkconfig only. Not "sdkconfig*": that glob also matched
    # the tracked sdkconfig.defaults[.<target>] files, which for an example
    # without the prologue ARE the example -- a downloaded from_registry was
    # missing the nine settings espos_core then refused to build without.
    - "examples/*/sdkconfig"
    - "examples/*/sdkconfig.old"
    - "examples/*/*.pem"
dependencies:
  idf: ">=6.0.0,<6.1.0"
  signalk-espos/espos_flow:
    # x-release-please-start-version
    version: "^0.21.0"
    # x-release-please-end
    override_path: "../espos_flow"
  signalk-espos/espos_sensors:
    # x-release-please-start-version
    version: "^0.21.0"
    # x-release-please-end
    override_path: "../espos_sensors"
  signalk-espos/espos_sk_flow:
    # x-release-please-start-version
    version: "^0.21.0"
    # x-release-please-end
    override_path: "../espos_sk_flow"
