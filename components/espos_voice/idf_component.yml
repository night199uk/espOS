## espos_voice component manifest: registry metadata for signalk-espos/espos_voice.
## The version is espOS's (version.txt) and moves with it, see docs/releasing.md.
# x-release-please-start-version
version: "0.22.0"
# x-release-please-end
description: "Wyoming voice satellite with esp-sr wake word"
url: "https://github.com/signalk-espOS/espOS/tree/main/components/espos_voice"
repository: "https://github.com/signalk-espOS/espOS.git"
documentation: "https://github.com/signalk-espOS/espOS/blob/main/docs/voice.md"
issues: "https://github.com/signalk-espOS/espOS/issues"
license: "Apache-2.0"
maintainers:
  - "Dirk Wahrheit <dirkwahrheit@gmail.com>"
tags:
  - signalk
  - marine
  - esp-idf
  - espos
  - voice
  - wyoming
  - wake-word
  - esp-sr
  - home-assistant
# No `targets`, although esp-sr -- and with it the satellite -- exists for
# esp32s3 and esp32p4 only: CMakeLists.txt registers an empty stub everywhere
# else, so the component does build on every target. A list here would also
# gate the whole project, not just this component: the component manager
# refuses to configure any target missing from the `targets` of ANY component
# in the tree ("not compatible with target esp32c6"), which is every espOS
# build except the two panels. The esp-sr rule below carries the restriction.
files:
  exclude:
    - "build/**/*"
    - "build-*/**/*"
    - "sdkconfig*"
    - "managed_components/**/*"
    - "dependencies.lock"
    - "examples/*/build/**/*"
    - "examples/*/build-*/**/*"
    - "examples/*/managed_components/**/*"
    - "examples/*/dependencies.lock"
    # The GENERATED sdkconfig only. Not "sdkconfig*": that glob also matched
    # the tracked sdkconfig.defaults[.<target>] files, which for an example
    # without the prologue ARE the example -- a downloaded from_registry was
    # missing the nine settings espos_core then refused to build without.
    - "examples/*/sdkconfig"
    - "examples/*/sdkconfig.old"
    - "examples/*/*.pem"
dependencies:
  idf: ">=6.0.0,<6.1.0"
  # Sibling espOS components. override_path makes an in-tree build (and a
  # firmware that vendors espOS as a submodule) use the checkout next to this
  # file instead of downloading espos/<name> from the registry; a copy fetched
  # from the registry has no such directory and the field is ignored there.
  signalk-espos/espos_audio:
    # x-release-please-start-version
    version: "^0.22.0"
    # x-release-please-end
    override_path: "../espos_audio"
  signalk-espos/espos_health:
    # x-release-please-start-version
    version: "^0.22.0"
    # x-release-please-end
    override_path: "../espos_health"
  # cJSON, exact-pinned like every other registry dependency here: the
  # Wyoming protocol code used ArduinoJson, which meant a firmware with a
  # voice satellite linked two JSON libraries -- cJSON for everything espOS
  # does and ArduinoJson for this one component -- and paid for both in
  # flash. Nothing in the protocol needed what ArduinoJson does differently.
  espressif/cjson: "==1.7.19~2"
  # Exact, like every other registry dependency here, and 2.5.5 is what the
  # caret already resolved to -- so this changes nothing but the freedom to
  # move without anyone deciding to. esp-sr carries the wake-word and speech
  # models and is the largest thing in a voice build; a minor arriving on its
  # own would change what is on a boat with no review and no flash.
  # tools/espos_registry_updates.py reports when a newer one exists.
  espressif/esp-sr:
    version: "==2.6.0"
    rules:
      - if: "target in [esp32s3, esp32p4]"
