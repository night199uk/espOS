## espos_n2k component manifest: registry metadata for signalk-espos/espos_n2k.
## The version is espOS's (version.txt) and moves with it, see docs/releasing.md.
# x-release-please-start-version
version: "0.17.2"
# x-release-please-end
description: "NMEA 2000 over TWAI: a candump TCP server, and an optional N2K node (address claim, instances, product info)"
url: "https://github.com/signalk-espOS/espOS/tree/main/components/espos_n2k"
repository: "https://github.com/signalk-espOS/espOS.git"
documentation: "https://github.com/signalk-espOS/espOS/blob/main/docs/n2k.md"
issues: "https://github.com/signalk-espOS/espOS/issues"
license: "Apache-2.0"
maintainers:
  - "Dirk Wahrheit <dirkwahrheit@gmail.com>"
tags:
  - signalk
  - marine
  - esp-idf
  - espos
  - nmea2000
  - twai
  - can
  - candump
# No `targets`, although the TWAI controller exists on esp32/s2/s3/c3/c5/c6/
# h2/h21/h4/p4 only and twai_node.cpp does not compile for the linux host:
# the component manager refuses to configure any target missing from the
# `targets` of ANY component in the tree, so a list without linux here would
# fail every host-test project that puts components/ on EXTRA_COMPONENT_DIRS.
files:
  exclude:
    - "build/**/*"
    - "build-*/**/*"
    - "sdkconfig*"
    - "managed_components/**/*"
    - "dependencies.lock"
    - "examples/*/build/**/*"
    - "examples/*/build-*/**/*"
    - "examples/*/managed_components/**/*"
    - "examples/*/dependencies.lock"
    # The GENERATED sdkconfig only. Not "sdkconfig*": that glob also matched
    # the tracked sdkconfig.defaults[.<target>] files, which for an example
    # without the prologue ARE the example -- a downloaded from_registry was
    # missing the nine settings espos_core then refused to build without.
    - "examples/*/sdkconfig"
    - "examples/*/sdkconfig.old"
    - "examples/*/*.pem"
dependencies:
  idf: ">=6.0.0,<6.1.0"
  # The settings behind espos_n2k::Node (CONFIG_ESPOS_N2K_NODE): the device
  # and system instance. Declared unconditionally because a manifest cannot
  # follow Kconfig; without the node nothing here links it. override_path
  # makes an in-tree build (and a firmware that vendors espOS as a submodule)
  # use the checkout next to this file; a registry copy has no such directory.
  signalk-espos/espos_config:
    # x-release-please-start-version
    version: "^0.17.2"
    # x-release-please-end
    override_path: "../espos_config"
  # mDNS left the IDF core in 5.0; exact-pinned like the other registry deps.
  espressif/mdns:
    version: "==1.14.0"
    rules:
      - if: "target != linux"
