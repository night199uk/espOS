## espos_time component manifest: registry metadata for signalk-espos/espos_time.
## The version is espOS's (version.txt) and moves with it, see docs/releasing.md.
# x-release-please-start-version
version: "0.18.1"
# x-release-please-end
description: "The device's wall clock: SNTP, SignalK and RTC sources behind one ranked API"
url: "https://github.com/signalk-espOS/espOS/tree/main/components/espos_time"
repository: "https://github.com/signalk-espOS/espOS.git"
documentation: "https://github.com/signalk-espOS/espOS/blob/main/docs/time.md"
issues: "https://github.com/signalk-espOS/espOS/issues"
license: "Apache-2.0"
maintainers:
  - "Dirk Wahrheit <dirkwahrheit@gmail.com>"
tags:
  - signalk
  - marine
  - esp-idf
  - espos
  - time
  - sntp
  - ntp
files:
  exclude:
    - "build/**/*"
    - "build-*/**/*"
    - "sdkconfig*"
    - "managed_components/**/*"
    - "dependencies.lock"
    - "examples/*/build/**/*"
    - "examples/*/build-*/**/*"
    - "examples/*/managed_components/**/*"
    - "examples/*/dependencies.lock"
    # The GENERATED sdkconfig only. Not "sdkconfig*": that glob also matched
    # the tracked sdkconfig.defaults[.<target>] files, which for an example
    # without the prologue ARE the example -- a downloaded from_registry was
    # missing the nine settings espos_core then refused to build without.
    - "examples/*/sdkconfig"
    - "examples/*/sdkconfig.old"
    - "examples/*/*.pem"
dependencies:
  idf: ">=6.0.0,<6.1.0"
  signalk-espos/espos_config:
    # x-release-please-start-version
    version: "^0.18.1"
    # x-release-please-end
    override_path: "../espos_config"
  signalk-espos/espos_httpd:
    # x-release-please-start-version
    version: "^0.18.1"
    # x-release-please-end
    override_path: "../espos_httpd"
  signalk-espos/espos_event:
    # x-release-please-start-version
    version: "^0.18.1"
    # x-release-please-end
    override_path: "../espos_event"
