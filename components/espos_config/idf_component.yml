## espos_config component manifest: registry metadata for signalk-espos/espos_config.
## The version is espOS's (version.txt) and moves with it, see docs/releasing.md.
# x-release-please-start-version
version: "0.22.0"
# x-release-please-end
description: "NVS config store, JSON-Schema descriptors, REST-backed settings"
url: "https://github.com/signalk-espOS/espOS/tree/main/components/espos_config"
repository: "https://github.com/signalk-espOS/espOS.git"
documentation: "https://github.com/signalk-espOS/espOS/blob/main/docs/config.md"
issues: "https://github.com/signalk-espOS/espOS/issues"
license: "Apache-2.0"
maintainers:
  - "Dirk Wahrheit <dirkwahrheit@gmail.com>"
tags:
  - signalk
  - marine
  - esp-idf
  - espos
  - config
  - nvs
  - json-schema
files:
  exclude:
    - "build/**/*"
    - "build-*/**/*"
    - "sdkconfig*"
    - "managed_components/**/*"
    - "dependencies.lock"
    - "examples/*/build/**/*"
    - "examples/*/build-*/**/*"
    - "examples/*/managed_components/**/*"
    - "examples/*/dependencies.lock"
    # The GENERATED sdkconfig only. Not "sdkconfig*": that glob also matched
    # the tracked sdkconfig.defaults[.<target>] files, which for an example
    # without the prologue ARE the example -- a downloaded from_registry was
    # missing the nine settings espos_core then refused to build without.
    - "examples/*/sdkconfig"
    - "examples/*/sdkconfig.old"
    - "examples/*/*.pem"
dependencies:
  idf: ">=6.0.0,<6.1.0"
  # cJSON left the IDF core in 6.0; pinned exactly, like the IDF version, so a
  # registry release cannot change the binary without a change in this repo.
  espressif/cjson: "==1.7.19~2"
  signalk-espos/espos_health:
    # x-release-please-start-version
    version: "^0.22.0"
    # x-release-please-end
    override_path: "../espos_health"
