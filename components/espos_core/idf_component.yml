## espos_core component manifest: registry metadata for signalk-espos/espos_core.
## The version is espOS's (version.txt) and moves with it, see docs/releasing.md.
# x-release-please-start-version
version: "0.18.0"
# x-release-please-end
description: "One-call boot: espos_start() brings log, config, HTTP, the network seam, WiFi and the optional stacks up in order"
url: "https://github.com/signalk-espOS/espOS/tree/main/components/espos_core"
repository: "https://github.com/signalk-espOS/espOS.git"
documentation: "https://github.com/signalk-espOS/espOS/blob/main/docs/concepts.md"
issues: "https://github.com/signalk-espOS/espOS/issues"
license: "Apache-2.0"
maintainers:
  - "Dirk Wahrheit <dirkwahrheit@gmail.com>"
tags:
  - signalk
  - marine
  - esp-idf
  - espos
  - runtime
  - boot
files:
  exclude:
    - "build/**/*"
    - "build-*/**/*"
    - "sdkconfig*"
    - "managed_components/**/*"
    - "dependencies.lock"
    - "examples/*/build/**/*"
    - "examples/*/build-*/**/*"
    - "examples/*/managed_components/**/*"
    - "examples/*/dependencies.lock"
    # The GENERATED sdkconfig only. Not "sdkconfig*": that glob also matched
    # the tracked sdkconfig.defaults[.<target>] files, which for an example
    # without the prologue ARE the example -- a downloaded from_registry was
    # missing the nine settings espos_core then refused to build without.
    - "examples/*/sdkconfig"
    - "examples/*/sdkconfig.old"
    - "examples/*/*.pem"
dependencies:
  idf: ">=6.0.0,<6.1.0"
  # Sibling espOS components. override_path makes an in-tree build (and a
  # firmware that vendors espOS as a submodule) use the checkout next to this
  # file instead of downloading espos/<name> from the registry; a copy fetched
  # from the registry has no such directory and the field is ignored there.
  # espos_sk, espos_ota and espos_ble are optional and deliberately absent:
  # a firmware that wants them lists them, and espos_start() picks them up.
  signalk-espos/espos_log:
    # x-release-please-start-version
    version: "^0.18.0"
    # x-release-please-end
    override_path: "../espos_log"
  signalk-espos/espos_config:
    # x-release-please-start-version
    version: "^0.18.0"
    # x-release-please-end
    override_path: "../espos_config"
  signalk-espos/espos_health:
    # x-release-please-start-version
    version: "^0.18.0"
    # x-release-please-end
    override_path: "../espos_health"
  signalk-espos/espos_httpd:
    # x-release-please-start-version
    version: "^0.18.0"
    # x-release-please-end
    override_path: "../espos_httpd"
  signalk-espos/espos_net:
    # x-release-please-start-version
    version: "^0.18.0"
    # x-release-please-end
    override_path: "../espos_net"
  # WiFi on every chip with a radio or a co-processor; the 802.15.4-only
  # H-series has neither and espos_wifi cannot build there (the CMakeLists
  # applies the same rule to its REQUIRES).
  signalk-espos/espos_wifi:
    # x-release-please-start-version
    version: "^0.18.0"
    # x-release-please-end
    override_path: "../espos_wifi"
    rules:
      - if: "target not in [esp32h2, esp32h21, esp32h4]"
  signalk-espos/espos_event:
    # x-release-please-start-version
    version: "^0.18.0"
    # x-release-please-end
    override_path: "../espos_event"
  signalk-espos/espos_time:
    # x-release-please-start-version
    version: "^0.18.0"
    # x-release-please-end
    override_path: "../espos_time"
