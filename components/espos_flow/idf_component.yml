## espos_flow component manifest: registry metadata for signalk-espos/espos_flow.
## The version is espOS's (version.txt) and moves with it, see docs/releasing.md.
# x-release-please-start-version
version: "0.23.0"
# x-release-please-end
description: "The data-flow runtime: one loop task, a timer wheel, a mailbox, and a typed producer/consumer graph"
url: "https://github.com/signalk-espOS/espOS/tree/main/components/espos_flow"
repository: "https://github.com/signalk-espOS/espOS.git"
documentation: "https://github.com/signalk-espOS/espOS/blob/main/docs/flow.md"
issues: "https://github.com/signalk-espOS/espOS/issues"
license: "Apache-2.0"
maintainers:
  - "Dirk Wahrheit <dirkwahrheit@gmail.com>"
tags:
  - signalk
  - marine
  - esp-idf
  - espos
  - dataflow
  - sensors
  - scheduler
files:
  exclude:
    - "build/**/*"
    - "build-*/**/*"
    - "sdkconfig*"
    - "managed_components/**/*"
    - "dependencies.lock"
    - "examples/*/build/**/*"
    - "examples/*/build-*/**/*"
    - "examples/*/managed_components/**/*"
    - "examples/*/dependencies.lock"
    # The GENERATED sdkconfig only. Not "sdkconfig*": that glob also matched
    # the tracked sdkconfig.defaults[.<target>] files, which for an example
    # without the prologue ARE the example -- a downloaded from_registry was
    # missing the nine settings espos_core then refused to build without.
    - "examples/*/sdkconfig"
    - "examples/*/sdkconfig.old"
    - "examples/*/*.pem"
dependencies:
  idf: ">=6.0.0,<6.1.0"
  # Sibling espOS components. override_path makes an in-tree build (and a
  # firmware that vendors espOS as a submodule) use the checkout next to this
  # file instead of downloading it from the registry; a copy fetched from the
  # registry has no such directory and the field is ignored there.
  #
  # espos_formulas is required rather than optional: transforms/marine.hpp is
  # written on top of it and includes it unconditionally, so a consumer that
  # did not have it failed to compile the moment it included
  # espos_flow/transforms.hpp. It is header-only and links nothing.
  signalk-espos/espos_formulas:
    # x-release-please-start-version
    version: "^0.23.0"
    # x-release-please-end
    override_path: "../espos_formulas"
